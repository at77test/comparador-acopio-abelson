name: Actualizar lista de precios ABELSON

on:
  schedule:
    - cron: '0 11 * * *'
    - cron: '0 16 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Descargar la lista de precios desde abelson.com.ar
        run: |
          curl -sL -f -o listaPrecios.xlsx "https://abelson.com.ar/precios/listaPrecios.xlsx" \
            -H "User-Agent: Mozilla/5.0 (compatible; AbelsonPriceSync/1.0)"
          echo "Tamaño del archivo descargado:"
          ls -la listaPrecios.xlsx

      - name: Commitear el archivo si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add listaPrecios.xlsx
          if git diff --cached --quiet; then
            echo "Sin cambios en la lista de precios, no hago commit."
          else
            git commit -m "Actualizar listaPrecios.xlsx ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
